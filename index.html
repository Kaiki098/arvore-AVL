<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Árvore AVL</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
  </head>
  <body>
    <div>
        <h1>Árvore AVL</h1>
        <!-- Funcionalidades: inserir, excluir, buscar -->
        <form id="avlForm">
          <label for="valor">Número:</label>
          <input type="number" name="valor" id="valor" />
          <button type="submit" name="acao" value="inserir">Inserir</button>
          <button type="submit" name="acao" value="remover">Remover</button>
          <button type="submit" name="acao" value="buscar">Buscar</button>
        </form>
    </div>
    <div>
      <!-- Estrutura da árvore -->
      <div class="box">
        <div class="box__header">
          <h2>Árvore</h2>
          <span id="tree-height">Altura: 0</span>
        </div>
        <div id="tree-container"></div>
      </div>

      <!-- 
    Menu de status: 
    a) qual nó estava desbalanceado
    b) qual tipo de rotação, como, por exemplo: "Rotação simples à direita no nó X"
     -->

      <div class="box">
        <h2 class="box__header">Status</h2>
        <div id="status"></div>
      </div>
    </div>
    <script src="script/main.js" type="module"></script>
  </body>
</html>
